<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potioncast Operator Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <!-- Operator Lock Screen -->
  <div id="lock-screen" class="lock-screen" style="display: none;">
    <div class="lock-card">
      <div style="font-size: 36px; margin-bottom: 12px;">🔮</div>
      <h1 class="lock-title">Operator Access</h1>
      <p class="lock-desc">Strictly restricted to Potioncast authorized operators (Hunter & Ayush).</p>

      <div id="auth-status" class="auth-status" style="display: none;"></div>

      <!-- Step 1: Request OTP -->
      <div id="auth-step-email">
        <div class="auth-field">
          <input 
            type="email" 
            id="operator-email" 
            class="auth-input" 
            placeholder="ayush@potioncast.com or hunter@potioncast.com"
            autocomplete="email"
            onkeydown="if(event.key==='Enter') window.OperatorAuth.requestOtp(this.value)"
          />
        </div>
        <button 
          id="btn-send-code" 
          class="btn-auth-primary" 
          onclick="window.OperatorAuth.requestOtp(document.getElementById('operator-email').value)">
          Send Operator Code
        </button>
        <div class="auth-footer-note">
          hunter@potioncast.com · ayush@potioncast.com
        </div>
      </div>

      <!-- Step 2: Verify OTP -->
      <div id="auth-step-otp" style="display: none;">
        <p style="font-size: 13px; color: #646059; margin-bottom: 16px; line-height: 1.4;">
          Check your email! Enter the 6-digit verification code sent to <strong id="auth-target-email"></strong>:
        </p>
        <div class="auth-field">
          <input 
            type="text" 
            id="operator-otp" 
            class="auth-input otp-input" 
            placeholder="123456" 
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            onkeydown="if(event.key==='Enter') window.OperatorAuth.verifyOtp(this.value)"
          />
        </div>
        <button 
          id="btn-verify-code" 
          class="btn-auth-primary" 
          onclick="window.OperatorAuth.verifyOtp(document.getElementById('operator-otp').value)">
          Verify & Enter Dashboard
        </button>
        <div style="margin-top: 14px;">
          <button class="btn-auth-link" onclick="window.OperatorAuth.resetStep()">← Use different email</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Authenticated Application Container -->
  <div id="app-container" style="max-width: 1100px; margin: 0 auto;">
    <!-- Top Navigation Header -->
    <header class="header-container">
      <div class="brand-wrapper">
        <span style="font-size: 20px;">🔮</span>
        <span class="brand-title">Potioncast</span>
        <span class="live-badge">Live</span>
      </div>

      <!-- Segmented Pill Navigation Tabs -->
      <nav class="nav-tabs" role="tablist">
        <button class="nav-tab active" data-tab="kpi" role="tab" aria-selected="true">
          KPI dashboard
        </button>
        <button class="nav-tab" data-tab="calendar" role="tab" aria-selected="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Event calendar
        </button>
        <button class="nav-tab" data-tab="marketing" role="tab" aria-selected="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
          Marketing
        </button>
      </nav>

      <div class="header-right">
        <span class="star-icon" title="Favorite">☆</span>
        <span id="user-email" class="meta-info"></span>
      </div>
    </header>

    <!-- Subheader with Title & Filter Controls -->
    <div class="filter-row">
      <div>
        <h1 id="view-title" style="font-size: 20px; font-weight: 600; color: #181818; margin-bottom: 2px;">KPI dashboard</h1>
        <div id="view-subtitle" class="meta-info">Updated 11:42 am</div>
      </div>

      <div id="filter-row" class="filter-pills">
        <button class="filter-pill active">This month</button>
        <button class="filter-pill">All time</button>
      </div>
    </div>

    <!-- Main View Content Area -->
    <main id="main-content">
      <!-- Injected dynamically via app.js -->
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>

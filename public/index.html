<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potioncast Operator Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <!-- Google OAuth Lock Screen -->
  <div id="lock-screen" class="lock-screen" style="display: none;">
    <div class="lock-card">
      <div style="font-size: 36px; margin-bottom: 12px;">🔮</div>
      <h1 class="lock-title">Operator Access</h1>
      <p class="lock-desc">Strictly restricted to Potioncast authorized operators (Hunter & Ayush).</p>
      <button class="btn-google" onclick="window.OperatorAuth.signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/>
        </svg>
        Sign in with Google
      </button>
      <div style="margin-top: 16px; font-size: 11px; color: #8E8A83;">
        hunter@potioncast.com · ayush@potioncast.com
      </div>
    </div>
  </div>

  <!-- Authenticated Application Container -->
  <div id="app-container" style="max-width: 1100px; margin: 0 auto;">
    <!-- Top Navigation Header -->
    <header class="header-container">
      <div class="brand-wrapper">
        <span style="font-size: 20px;">🔮</span>
        <span class="brand-title">Potioncast</span>
        <span class="live-badge">Live</span>
      </div>

      <!-- Segmented Pill Navigation Tabs -->
      <nav class="nav-tabs" role="tablist">
        <button class="nav-tab active" data-tab="kpi" role="tab" aria-selected="true">
          KPI dashboard
        </button>
        <button class="nav-tab" data-tab="calendar" role="tab" aria-selected="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Event calendar
        </button>
        <button class="nav-tab" data-tab="marketing" role="tab" aria-selected="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
          Marketing
        </button>
      </nav>

      <div class="header-right">
        <span class="star-icon" title="Favorite">☆</span>
        <span id="user-email" class="meta-info"></span>
      </div>
    </header>

    <!-- Subheader with Title & Filter Controls -->
    <div class="filter-row">
      <div>
        <h1 id="view-title" style="font-size: 20px; font-weight: 600; color: #181818; margin-bottom: 2px;">KPI dashboard</h1>
        <div id="view-subtitle" class="meta-info">Updated 11:42 am</div>
      </div>

      <div id="filter-row" class="filter-pills">
        <button class="filter-pill active">This month</button>
        <button class="filter-pill">All time</button>
      </div>
    </div>

    <!-- Main View Content Area -->
    <main id="main-content">
      <!-- Injected dynamically via app.js -->
    </main>
  </div>

  <!-- Scripts -->
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
